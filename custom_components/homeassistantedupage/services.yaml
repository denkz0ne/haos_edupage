rate_meal:
  name: Ohodnotiť stravu
  description: Ohodnotí množstvo a kvalitu zvoleného menu v školskej jedálni.
  fields:
    date:
      name: Dátum
      description: Dátum stravy vo formáte RRRR-MM-DD.
      example: "2026-09-03"
      required: true
    meal_type:
      name: Druh jedla
      description: Desiata, obed alebo olovrant.
      example: lunch
      required: true
      selector:
        select:
          translation_key: meal_type
          options:
            - snack
            - lunch
            - afternoon_snack
    menu_number:
      name: Číslo menu
      description: Číslo menu, ktoré sa má hodnotiť.
      example: "2"
      required: true
    quantity:
      name: Množstvo
      description: Hodnotenie množstva od 1 do 10.
      example: 8
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    quality:
      name: Kvalita
      description: Hodnotenie kvality od 1 do 10.
      example: 9
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    entry_id:
      name: Konfiguračný záznam
      description: ID konfiguračného záznamu EduPage. Použite ho, ak je nastavených viac účtov alebo žiakov.
      example: 01J4XYZABC
      required: false

send_message:
  name: Odoslať správu
  description: Odošle správu vybraným žiakom alebo učiteľom cez EduPage.
  fields:
    recipients:
      name: Príjemcovia
      description: Jeden alebo viacerí príjemcovia podľa mena alebo číselného ID osoby.
      example: ["Test User", "12345"]
      required: true
    body:
      name: Text správy
      description: Obsah správy, ktorá sa má odoslať.
      example: "Nezabudni si zajtra priniesť domácu úlohu."
      required: true
    entry_id:
      name: Konfiguračný záznam
      description: ID konfiguračného záznamu EduPage. Použite ho, ak je nastavených viac účtov alebo žiakov.
      example: 01J4XYZABC
      required: false
