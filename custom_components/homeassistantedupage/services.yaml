choose_meal:
  name: Vybrať stravu
  description: Vyberie menu v školskej jedálni na zvolený deň a druh jedla.
  fields:
    date:
      name: Dátum
      description: Dátum stravy vo formáte RRRR-MM-DD.
      example: "2026-09-03"
      required: true
    meal_type:
      name: Druh jedla
      description: Desiata, obed alebo olovrant.
      example: lunch
      required: true
      selector:
        select:
          translation_key: meal_type
          options:
            - snack
            - lunch
            - afternoon_snack
    number:
      name: Číslo menu
      description: Číslo menu, ktoré sa má vybrať (1 až 8).
      example: 2
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    entry_id:
      name: Konfiguračný záznam
      description: ID konfiguračného záznamu EduPage. Použite ho, ak je nastavených viac účtov alebo žiakov.
      example: 01J4XYZABC
      required: false

