name: HACS Action

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "topics issues"
