name: Apply compact entity names

on:
  push:
    branches:
      - feature/compact-entity-names

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-entity-names
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact names
        run: python tools/apply_compact_entity_names.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/homeassistantedupage
          git commit -m "feat: use compact student entity names"
          git push origin HEAD:feature/compact-entity-names
